policy_kwargs:
  features_extractor_class: train.extractors.features_extractor.FeaturesExtractor
  features_extractor_kwargs:
    proprioception_kwargs:
      hidden_dims: [256, 256, 128]

      activation_fn:
        _target_: torch.nn.ReLU

    navigation_kwargs:
      max_tokens: 3
      d_model: 16
      num_layers: 1
      nhead: 2

      activation_fn:
        _target_: torch.nn.ReLU

    terrain_kwargs:
      resolution: 8

      hidden_dims: [128, 64, 32]

      activation_fn:
        _target_: torch.nn.ReLU

    gate_ratios:
      proprioception_ratio: 1.0
      navigation_ratio: 0.0
      terrain_ratio: 0.0
      passion_ratio: 0.0

  net_arch:
    pi: [256, 256]
    qf: [512, 512]

unity_params:
  navigation:
    max_tokens: ${model.policy_kwargs.features_extractor_kwargs.navigation_kwargs.max_tokens} # do not modify

  terrain:
    resolution: ${model.policy_kwargs.features_extractor_kwargs.terrain_kwargs.resolution} # do not modify

  passion:
    ratio: ${model.policy_kwargs.features_extractor_kwargs.gate_ratios.passion_ratio} # do not modify

  assist:
    target_assist: 0.2
    height_assist: 0.5
    rotation_assist: 0.5

  reward:
    stay_success_reward: 0.0
    staying_reward: 0.0
    stay_success_threshold: 5.0

    distance_penalty_multiplier: 0.0
    jitter_penalty_multiplier: 0.5
    energy_penalty_multiplier: 0.5
    upright_reward_multiplier: 2.0
    height_match_reward_multiplier: 1.0
    direction_reward_multiplier: 0.0

  normalization:
    expected_max_speed: 5.0
    expected_max_distance: 10.0
    expected_max_thickness: 1.0
    expected_max_height: 2.0
    expected_max_force: 300.0
